<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>PA#2</title>
    <style>
        body {
            background-color: #EEEEEE;
        }

        #canvas-holder {
            float: left;
            margin: 0 20px 0 0;
        }
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./Utils/socket.io.min.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./Model.js"></script>
    <script src="./StereoCamera.js"></script>
    <script src="./Texture.js"></script>
    <script src="./main.js"></script>

</head>

<body onload="init()">

    <h2>A Cube with "Trackball" Mouse Rotation</h2>

    <p id="message">Drag your mouse on the cube to rotate it.<br>
        (On a touch screen, you can use your finger.)</p>

    <div class="main-container">
        <div id="canvas-holder">
            <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
        </div>
        <fieldset>
            <legend>Change stereo camera parameters</legend>
            <div>
                <label for="eye">Eye separation</label>
                <input min="0" max="1" step="0.01" value="0.5" type="range" name="Eye separation parameter"
                    onchange="changeEye(this.value)" id="eye">
            </div>
            <div>
                <label for="field">Field of View</label>
                <input min="0.01" max="1" step="0.01" value="0.5" type="range" name="Field of View angle"
                    onchange="changeField(this.value)" id="field">
            </div>
            <div>
                <label for="near">Near Clipping distance</label>
                <input min="8" max="12" step="0.1" value="8" type="range" name="Near Clipping distance"
                    onchange="changeNear(this.value)" id="near">
            </div>
            <div>
                <label for="convergence">Convergence</label>
                <input min="10" max="100" step="10" value="14" type="range" name="Convergence distance"
                    onchange="changeConvergence(this.value)" id="convergence">
            </div>
        </fieldset>


    </div>


</body>

</html>
